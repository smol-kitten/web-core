# Full build pipeline:
# 1. Resolve the latest PHP 8.4.x release from php.net
# 2. Build and push builder images (prep_base) with compiled PHP + all extensions
# 3. Build and push all nginx runtime variants
# 4. Build and push static/SPA and Bun images
# 5. Scan a sample image with Trivy
# 6. Clean up untagged container versions
#
# Triggers:
#   push to main  — always run full build
#   weekly Sunday — always run full build (new PHP releases, fresh base layers)
#
# Base image hierarchy:
#   monthly-base.yml → ubuntu-base (GHCR mirror of Docker Hub ubuntu)
#   build.yml weekly → prep_base  (PHP compiled from source, built on ubuntu-base)
#   security-update.yml daily → runtime images (apt security patches, built on ubuntu-base)

name: Build Docker Images

on:
  push:
    branches: [ main ]
  schedule:
    - cron: '36 4 * * 0'  # Weekly Sunday 04:00 UTC – full rebuild
  workflow_dispatch:
    inputs:
      php_version_override:
        description: 'Override PHP version (leave blank to auto-resolve latest 8.4.x)'
        required: false
        default: ''
      nginx_only:
        description: 'Rebuild only the nginx images (skip builder, static, bun); the published prep_base is used'
        type: boolean
        required: false
        default: false
      nginx_versions:
        description: 'JSON list of Ubuntu versions for the nginx matrix, e.g. ["24.04"] (blank = all)'
        required: false
        default: ''

concurrency:
  group: '${{ github.workflow }}-${{ github.ref }}'
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# docker/build-push-action uploads a *.dockerbuild record artifact per build; keep it to the
# fleet artifact classes (tag 30 d, PR 3 d, other refs 7 d) instead of the org default.
env:
  DOCKER_BUILD_RECORD_RETENTION_DAYS: ${{ startsWith(github.ref, 'refs/tags/') && 30 || (github.event_name == 'pull_request' && 3 || 7) }}

jobs:
  # ------------------------------------------------------------------
  # Resolve latest PHP 8.4.x from php.net (avoids hardcoded versions)
  # ------------------------------------------------------------------
  resolve-php-version:
    runs-on: self-hosted
    outputs:
      php_version: ${{ steps.php.outputs.version }}
      php_sha256: ${{ steps.php.outputs.sha256 }}
    steps:
      - name: Fetch latest PHP 8.4.x version
        id: php
        run: |
          OVERRIDE="${{ github.event.inputs.php_version_override }}"
          if [ -n "$OVERRIDE" ]; then
            VERSION="$OVERRIDE"
          else
            VERSION=$(curl -fsSL 'https://www.php.net/releases/index.php?json&version=8.4' \
              | python3 -c "import sys,json; print(json.load(sys.stdin)['version'])" 2>/dev/null \
              || echo "8.4.27")
          fi
          # sha256 of the tar.gz as php.net publishes it; Dockerfile_prep_base verifies the download
          # against it. No silent fallback: a version without a published checksum fails here.
          SHA256=$(curl -fsSL "https://www.php.net/releases/index.php?json&version=${VERSION}" \
            | python3 -c "import sys,json; print(next(s['sha256'] for s in json.load(sys.stdin)['source'] if s['filename'].endswith('.tar.gz')))") \
            || { echo "::error::php.net publishes no tar.gz sha256 for PHP ${VERSION}"; exit 1; }
          echo "Resolved PHP version: $VERSION (tar.gz sha256 $SHA256)"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "sha256=$SHA256" >> "$GITHUB_OUTPUT"

  # ------------------------------------------------------------------
  # Build and push prep_base (PHP compiled from source + all PECL exts)
  # Uses ubuntu-base from GHCR — never pulls from Docker Hub.
  # ------------------------------------------------------------------
  build-builder:
    needs: resolve-php-version
    if: ${{ !inputs.nginx_only }}
    runs-on: self-hosted
    strategy:
      fail-fast: false
      # 3 parallel prep_base builds alone tripped the mari-gate EMERGENCY valve on n4 (2026-10-18
      # 10:16-10:28Z, 21 entries, load1 23.6); nginx at max-parallel 2 caused none.
      max-parallel: 1
      matrix:
        version: [ "24.04", "25.04", "25.10" ]
    continue-on-error: ${{ matrix.version == '25.10' }}
    steps:
      - uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Ensure buildx cache directory
        run: |
          sudo mkdir -p /home/runner/.cache/buildx/prep-base
          sudo chmod -R 0777 /home/runner/.cache/buildx || true

      - name: Build and push builder image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./Dockerfile_prep_base
          push: true
          tags: ghcr.io/${{ github.repository_owner }}/prep_base:${{ matrix.version }}
          build-args: |
            BASE_IMAGE=ghcr.io/${{ github.repository_owner }}/ubuntu-base:${{ matrix.version }}
            PHP_VERSION=${{ needs.resolve-php-version.outputs.php_version }}
            PHP_SHA256=${{ needs.resolve-php-version.outputs.php_sha256 }}
          cache-from: type=local,src=/home/runner/.cache/buildx/prep-base
          cache-to:   type=local,dest=/home/runner/.cache/buildx/prep-base,mode=max

  # ------------------------------------------------------------------
  # Build and push all nginx runtime variants (96 configs)
  # 1 server × 3 Ubuntu versions × 2^5 extension combos = 96
  # ------------------------------------------------------------------
  build-nginx:
    needs: [ resolve-php-version, build-builder ]
    # build-builder is skipped on an nginx-only dispatch; then the published prep_base is used.
    if: ${{ !cancelled() && needs.resolve-php-version.result == 'success' && (needs.build-builder.result == 'success' || needs.build-builder.result == 'skipped') }}
    runs-on: self-hosted
    strategy:
      fail-fast: false
      # n4 has 6 runners shared with the whole fleet; 20 filled all of them with image builds and
      # tripped the mari-gate EMERGENCY valve (2026-10-18 09:10-09:36Z, load1 up to 41).
      max-parallel: 2
      matrix:
        version:   ${{ fromJSON(inputs.nginx_versions != '' && inputs.nginx_versions || '["24.04","25.04","25.10"]') }}
        imagick:   [ "true", "false" ]
        redis:     [ "true", "false" ]
        memcached: [ "true", "false" ]
        ssh2:      [ "true", "false" ]
        cron:      [ "true", "false" ]
    continue-on-error: ${{ matrix.version == '25.10' }}
    steps:
      - uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build image tag
        id: meta
        run: |
          TAG=""
          [ "${{ matrix.imagick }}"   = "true" ] && TAG="${TAG}-imagick"
          [ "${{ matrix.redis }}"     = "true" ] && TAG="${TAG}-redis"
          [ "${{ matrix.memcached }}" = "true" ] && TAG="${TAG}-memcached"
          [ "${{ matrix.ssh2 }}"      = "true" ] && TAG="${TAG}-ssh2"
          [ "${{ matrix.cron }}"      = "true" ] && TAG="${TAG}-cron"
          echo "image_tag=ghcr.io/${{ github.repository_owner }}/nginx:${{ matrix.version }}${TAG}" \
            >> "$GITHUB_OUTPUT"
        shell: bash

      - name: Ensure buildx cache directory
        run: |
          sudo mkdir -p "/home/runner/.cache/buildx/nginx-${{ matrix.version }}"
          sudo chmod -R 0777 /home/runner/.cache/buildx || true

      - name: Build and push nginx variant image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./Dockerfile_nginx
          push: true
          pull: true
          tags: ${{ steps.meta.outputs.image_tag }}
          build-args: |
            BUILDER_IMAGE=ghcr.io/${{ github.repository_owner }}/prep_base:${{ matrix.version }}
            UBUNTU_IMAGE=ghcr.io/${{ github.repository_owner }}/ubuntu-base:${{ matrix.version }}
            INSTALL_IMAGICK=${{ matrix.imagick }}
            INSTALL_REDIS=${{ matrix.redis }}
            INSTALL_MEMCACHED=${{ matrix.memcached }}
            INSTALL_SSH2=${{ matrix.ssh2 }}
            INSTALL_CRON=${{ matrix.cron }}
          cache-from: type=local,src=/home/runner/.cache/buildx/nginx-${{ matrix.version }}
          cache-to:   type=local,dest=/home/runner/.cache/buildx/nginx-${{ matrix.version }},mode=max

      # Check the pushed tag itself: it must run the resolved PHP version and its nginx config must load.
      - name: Verify pushed image (php -v, nginx -t, healthcheck tools)
        run: |
          IMAGE="${{ steps.meta.outputs.image_tag }}"
          WANT="${{ needs.resolve-php-version.outputs.php_version }}"
          GOT=$(docker run --rm --pull always "$IMAGE" php -r 'echo PHP_VERSION;')
          echo "$IMAGE: PHP $GOT (want $WANT)"
          [ "$GOT" = "$WANT" ] || { echo "::error::$IMAGE runs PHP $GOT, expected $WANT"; exit 1; }
          docker run --rm "$IMAGE" nginx -t
          # Tools that app healthchecks call (ss / wget / pgrep; /etc/services for "ss ... :http").
          docker run --rm "$IMAGE" sh -c 'for b in ss wget pgrep bash; do command -v $b >/dev/null || { echo "missing: $b"; exit 1; }; done; test -f /etc/services || { echo "missing: /etc/services"; exit 1; }'

  # ------------------------------------------------------------------
  # Build static / SPA images (no PHP, all ubuntu versions)
  # ------------------------------------------------------------------
  build-static:
    if: ${{ !inputs.nginx_only }}
    runs-on: self-hosted
    strategy:
      fail-fast: false
      matrix:
        version: [ "24.04", "25.04", "25.10" ]
    continue-on-error: ${{ matrix.version == '25.10' }}
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Ensure buildx cache directory
        run: |
          sudo mkdir -p /home/runner/.cache/buildx/static-${{ matrix.version }}
          sudo chmod -R 0777 /home/runner/.cache/buildx || true
      - name: Build and push static image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./Dockerfile_static
          push: true
          pull: true
          tags: ghcr.io/${{ github.repository_owner }}/static:${{ matrix.version }}
          build-args: UBUNTU_IMAGE=ghcr.io/${{ github.repository_owner }}/ubuntu-base:${{ matrix.version }}
          cache-from: type=local,src=/home/runner/.cache/buildx/static-${{ matrix.version }}
          cache-to:   type=local,dest=/home/runner/.cache/buildx/static-${{ matrix.version }},mode=max

  # ------------------------------------------------------------------
  # Build Bun edge runtime image
  # ------------------------------------------------------------------
  build-bun:
    if: ${{ !inputs.nginx_only }}
    runs-on: self-hosted
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Ensure buildx cache directory
        run: |
          sudo mkdir -p /home/runner/.cache/buildx/bun
          sudo chmod -R 0777 /home/runner/.cache/buildx || true
      - name: Build and push Bun image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./Dockerfile_bun
          push: true
          tags: ghcr.io/${{ github.repository_owner }}/bun:latest
          build-args: UBUNTU_IMAGE=ghcr.io/${{ github.repository_owner }}/ubuntu-base:24.04
          cache-from: type=local,src=/home/runner/.cache/buildx/bun
          cache-to:   type=local,dest=/home/runner/.cache/buildx/bun,mode=max

  # ------------------------------------------------------------------
  # Matrix report: continue-on-error hides failing legs (every 25.10 leg failed from January to
  # 2026-10-18 and nobody noticed, so 8 prod sites ran 9-month-old images). This job lists every
  # failed build leg in the step summary and FAILS when there is one, so the run turns red.
  # ------------------------------------------------------------------
  matrix-report:
    needs: [ build-nginx, build-static, build-bun ]
    if: ${{ !cancelled() }}
    runs-on: self-hosted
    permissions:
      actions: read
    steps:
      - name: Fail loudly on any failed build leg
        uses: actions/github-script@v9
        with:
          script: |
            const jobs = await github.paginate(github.rest.actions.listJobsForWorkflowRunAttempt, {
              owner: context.repo.owner, repo: context.repo.repo,
              run_id: context.runId, attempt_number: Number(process.env.GITHUB_RUN_ATTEMPT || 1), per_page: 100 });
            const legs = jobs.filter(j => /^build-(nginx|static|bun|builder)\b/.test(j.name));
            const failed = legs.filter(j => j.conclusion === 'failure');
            const skipped = legs.filter(j => j.conclusion === 'skipped').length;
            await core.summary
              .addHeading(`Build legs: ${legs.length - failed.length - skipped} ok, ${failed.length} FAILED, ${skipped} skipped`, 3)
              .addList(failed.map(j => `${j.name}: ${j.html_url}`))
              .write();
            if (failed.length) core.setFailed(`${failed.length} build leg(s) failed (continue-on-error hid them): ${failed.map(j => j.name).join('; ')}`);

  # ------------------------------------------------------------------
  # Trivy vulnerability scan on a representative image
  # ------------------------------------------------------------------
  scan-images:
    needs: build-nginx
    runs-on: self-hosted
    strategy:
      fail-fast: false
      matrix:
        version: [ "24.04", "25.04" ]
    steps:
      - name: Run Trivy scan
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: ghcr.io/${{ github.repository_owner }}/nginx:${{ matrix.version }}-imagick
          format: table
          exit-code: '0'
          severity: CRITICAL,HIGH
          ignore-unfixed: true

  # ------------------------------------------------------------------
  # Remove untagged container versions from the registry
  # ------------------------------------------------------------------
  # DISABLED 2026-10-18: this deleted the platform manifests of tagged multi-arch images. Buildx pushes an
  # OCI index whose per-platform and attestation manifests are UNTAGGED package versions in GHCR, so
  # "delete every untagged version" removed the image content under live tags: after the 09:59Z run,
  # prep_base:24.04/25.04, static:24.04 and bun:latest had 2 of 2 child manifests missing (unpullable;
  # web-core #47 smoke-test: "failed to resolve source metadata for ghcr.io/smol-kitten/prep_base:24.04").
  # It also reads only the first page of versions. Re-enable only with a cleanup that keeps every
  # manifest referenced by a tagged index (e.g. dataaxiom/ghcr-cleanup-action, which handles multi-arch).
  cleanup-untagged:
    needs: [ build-nginx, build-static, build-bun ]
    runs-on: self-hosted
    if: false
    steps:
      - name: Delete untagged image versions
        uses: actions/github-script@v9
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const packages = ['nginx', 'static', 'bun', 'prep_base', 'ubuntu-base'];
            const owner = context.repo.owner;

            async function getVersions(packageName) {
              try {
                const res = await github.rest.packages.getAllPackageVersionsForPackageOwnedByOrg({
                  package_type: 'container', package_name: packageName, org: owner
                });
                return res.data;
              } catch {
                const res = await github.rest.packages.getAllPackageVersionsForPackageOwnedByUser({
                  package_type: 'container', package_name: packageName, username: owner
                });
                return res.data;
              }
            }

            async function deleteVersion(packageName, versionId) {
              try {
                await github.rest.packages.deletePackageVersionForOrg({
                  package_type: 'container', package_name: packageName,
                  org: owner, package_version_id: versionId
                });
              } catch {
                await github.rest.packages.deletePackageVersionForUser({
                  package_type: 'container', package_name: packageName,
                  username: owner, package_version_id: versionId
                });
              }
            }

            for (const pkg of packages) {
              try {
                const versions = await getVersions(pkg);
                const untagged = versions.filter(v => !v.metadata?.container?.tags?.length);
                console.log(`${pkg}: ${untagged.length} untagged version(s) to remove`);
                for (const v of untagged) {
                  try {
                    await deleteVersion(pkg, v.id);
                    console.log(`  Deleted version ${v.id}`);
                  } catch (e) {
                    console.log(`  Failed to delete ${v.id}: ${e.message}`);
                  }
                }
              } catch (e) {
                console.log(`Skipping ${pkg}: ${e.message}`);
              }
            }
