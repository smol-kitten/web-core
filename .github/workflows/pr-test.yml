# PR test pipeline — runs on every pull request targeting main.
# Fast checks only: Dockerfile linting + a single no-push runtime build
# using the existing prep_base from the registry.  Does NOT push anything.

name: PR Test

on:
  pull_request:
    branches: [ main ]
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - 'LICENSE'
      - '.gitignore'
      - '.editorconfig'
  workflow_dispatch:

concurrency:
  group: '${{ github.workflow }}-${{ github.ref }}'
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# docker/build-push-action uploads a *.dockerbuild record artifact per build; keep it to the
# fleet artifact classes (tag 30 d, PR 3 d, other refs 7 d) instead of the org default.
env:
  DOCKER_BUILD_RECORD_RETENTION_DAYS: ${{ startsWith(github.ref, 'refs/tags/') && 30 || (github.event_name == 'pull_request' && 3 || 7) }}

jobs:
  # ------------------------------------------------------------------
  # Dockerfile lint with hadolint
  # ------------------------------------------------------------------
  lint:
    runs-on: self-hosted
    steps:
      - uses: actions/checkout@v7

      - name: Lint Dockerfile_prep_base
        uses: hadolint/hadolint-action@v3.5.0
        with:
          dockerfile: Dockerfile_prep_base

      - name: Lint Dockerfile_nginx
        uses: hadolint/hadolint-action@v3.5.0
        with:
          dockerfile: Dockerfile_nginx

      - name: Lint Dockerfile_static
        uses: hadolint/hadolint-action@v3.5.0
        with:
          dockerfile: Dockerfile_static

      - name: Lint Dockerfile_bun
        uses: hadolint/hadolint-action@v3.5.0
        with:
          dockerfile: Dockerfile_bun

  # ------------------------------------------------------------------
  # Check whether the cached prep_base image exists in the registry.
  # The runtime build jobs depend on it; if it hasn't been built yet
  # (build.yml only runs on push to main) we skip rather than fail.
  # ------------------------------------------------------------------
  check-prep-base:
    runs-on: self-hosted
    needs: lint
    outputs:
      available: ${{ steps.probe.outputs.available }}
    steps:
      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Probe registry for prep_base:24.04
        id: probe
        run: |
          IMAGE="ghcr.io/${{ github.repository_owner }}/prep_base:24.04"
          if docker manifest inspect "$IMAGE" > /dev/null 2>&1; then
            echo "available=true"  >> "$GITHUB_OUTPUT"
            echo "prep_base found in registry — build tests will run"
          else
            echo "available=false" >> "$GITHUB_OUTPUT"
            echo "prep_base not yet in registry (run build.yml on main first) — skipping build tests"
          fi

  # ------------------------------------------------------------------
  # Test runtime build (nginx + imagick, Ubuntu 24.04, no push)
  # Uses the already-built prep_base from the registry so this is fast.
  # ------------------------------------------------------------------
  test-build-nginx:
    runs-on: self-hosted
    needs: check-prep-base
    if: needs.check-prep-base.outputs.available == 'true'
    steps:
      - uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build nginx runtime image (no push)
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./Dockerfile_nginx
          push: false
          build-args: |
            BUILDER_IMAGE=ghcr.io/${{ github.repository_owner }}/prep_base:24.04
            UBUNTU_IMAGE=ghcr.io/${{ github.repository_owner }}/ubuntu-base:24.04
            INSTALL_IMAGICK=true
            INSTALL_REDIS=false
            INSTALL_MEMCACHED=false
            INSTALL_SSH2=false
            INSTALL_CRON=false

  # ------------------------------------------------------------------
  # Smoke test: start a container and verify PHP-FPM + nginx respond
  # ------------------------------------------------------------------
  smoke-test:
    runs-on: self-hosted
    needs: test-build-nginx
    if: needs.test-build-nginx.result == 'success'
    steps:
      - uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build test image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./Dockerfile_nginx
          push: false
          load: true
          tags: pr-smoke-test:latest
          build-args: |
            BUILDER_IMAGE=ghcr.io/${{ github.repository_owner }}/prep_base:24.04
            UBUNTU_IMAGE=ghcr.io/${{ github.repository_owner }}/ubuntu-base:24.04
            INSTALL_IMAGICK=true

      # On a runner that is itself a container (n4-runner-*), a published port (-p) lands on the docker
      # host and localhost cannot reach it: the smoke test failed there with HTTP 000 (2026-10-18,
      # n4-runner-1) and passed only on runner-pve. When the runner is a container, the test container
      # joins its network namespace and listens on 127.0.0.1:80 (same pattern as fleet-actions db-service).
      - name: Run smoke test
        run: |
          docker rm -f smoke-test >/dev/null 2>&1 || true
          self=""
          for c in "$(hostname)" "$(grep -oE '/docker/containers/[0-9a-f]{64}' /proc/self/mountinfo | head -1 | cut -d/ -f4 || true)"; do
            if [ -n "$c" ] && docker inspect "$c" >/dev/null 2>&1; then self=$c; break; fi
          done
          if [ -n "$self" ]; then net=(--network "container:$self"); URL=http://127.0.0.1:80/
          else net=(-p 127.0.0.1:18080:80); URL=http://127.0.0.1:18080/; fi
          echo "smoke URL: $URL"
          docker run -d --name smoke-test "${net[@]}" \
            -e QUICK_SET=API \
            -e HEALTH_WORKER=false \
            pr-smoke-test:latest

          echo "Waiting for services to start..."
          for i in $(seq 1 30); do
            HTTP_CODE=$(curl -sf -o /dev/null -w "%{http_code}" "$URL" 2>/dev/null || echo 000)
            [ "$HTTP_CODE" = "200" ] && break
            sleep 1
          done

          HTTP_CODE=$(curl -sf -o /dev/null -w "%{http_code}" "$URL" || echo 000)
          echo "HTTP response: $HTTP_CODE"

          docker logs smoke-test

          docker stop smoke-test && docker rm smoke-test

          [ "$HTTP_CODE" = "200" ] || { echo "Expected 200, got $HTTP_CODE"; exit 1; }

      # Consumer layout: the app brings its own nginx.conf (no "main" log format) and its own site on
      # another port, next to the image's default site. The 2026-10-20 image put a default site that
      # used "access_log ... main" there, so nginx refused to start in that layout (m-schneider.cc down,
      # 2026-10-21). This starts nginx in that layout and checks both servers answer.
      - name: Consumer nginx layout test
        run: |
          docker rm -f consumer-test >/dev/null 2>&1 || true
          self=""
          for c in "$(hostname)" "$(grep -oE '/docker/containers/[0-9a-f]{64}' /proc/self/mountinfo | head -1 | cut -d/ -f4 || true)"; do
            if [ -n "$c" ] && docker inspect "$c" >/dev/null 2>&1; then self=$c; break; fi
          done
          if [ -n "$self" ]; then net=(--network "container:$self"); H=127.0.0.1; P80=80; P3000=3000
          else net=(-p 127.0.0.1:18080:80 -p 127.0.0.1:13000:3000); H=127.0.0.1; P80=18080; P3000=13000; fi
          docker create --name consumer-test "${net[@]}" -e QUICK_SET=API -e HEALTH_WORKER=false pr-smoke-test:latest >/dev/null
          docker cp tests/consumer-nginx/nginx.conf consumer-test:/etc/nginx/nginx.conf
          docker cp tests/consumer-nginx/site.conf  consumer-test:/etc/nginx/sites-enabled/site.conf
          docker start consumer-test >/dev/null
          for i in $(seq 1 30); do
            A=$(curl -s -o /dev/null -w "%{http_code}" "http://$H:$P80/"   2>/dev/null || true)
            B=$(curl -s -o /dev/null -w "%{http_code}" "http://$H:$P3000/" 2>/dev/null || true)
            [ "$A" = "200" ] && [ "$B" = "200" ] && break
            sleep 1
          done
          rc=0
          docker exec consumer-test nginx -t || rc=1
          docker exec consumer-test php -v | head -1
          echo "default site :80 -> HTTP $A, consumer site :3000 -> HTTP $B"
          [ "$A" = "200" ] && [ "$B" = "200" ] || rc=1
          docker logs consumer-test 2>&1 | tail -40
          docker rm -f consumer-test >/dev/null
          [ "$rc" = 0 ] || { echo "::error::nginx does not start in the consumer layout (own nginx.conf + own site next to the default site)"; exit 1; }
