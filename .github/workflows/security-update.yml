# Daily security update workflow
# Rebuilds only the runtime images (no PHP source compilation) so that
# OS-level security patches from apt are applied every day without the
# expensive prep_base rebuild.  prep_base is rebuilt weekly by build.yml.
#
# Uses ubuntu-base from GHCR (mirrored monthly by monthly-base.yml) so
# the runtime base layer is always from our own registry, never Docker Hub.
#
# nginx: only the variants that fleet repos use are rebuilt daily (5 variants
# x 3 Ubuntu versions = 15 images). The full set of 96 is rebuilt weekly by
# build.yml (Sunday). All 96 daily wrote ~340 GiB a day to the runner SSDs
# (measured 2026-11-10). To get a variant rebuilt daily, add it to `variant`.
#
# No build cache here on purpose: a cache hit on the apt layers would make the
# daily rebuild a no-op. The local cache was exported by every job and never
# imported (job logs 2026-11-10: no import line, apt layer ran in full).

name: Daily Security Update

on:
  schedule:
    - cron: '49 2 * * *'  # Daily 02:00 UTC
  workflow_dispatch:

concurrency:
  group: '${{ github.workflow }}-${{ github.ref }}'
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# docker/build-push-action uploads a *.dockerbuild record artifact per build; keep it to the
# fleet artifact classes (tag 30 d, PR 3 d, other refs 7 d) instead of the org default.
env:
  DOCKER_BUILD_RECORD_RETENTION_DAYS: ${{ startsWith(github.ref, 'refs/tags/') && 30 || (github.event_name == 'pull_request' && 3 || 7) }}

jobs:
  rebuild-nginx:
    runs-on: self-hosted
    strategy:
      fail-fast: false
      # n4 has 6 runners shared with the whole fleet; 20 filled all of them with image builds and
      # tripped the mari-gate EMERGENCY valve (2026-10-18 09:10-09:36Z, load1 up to 41).
      max-parallel: 2
      matrix:
        version: [ "24.04", "25.10", "26.04" ]
        # Tag suffix without the leading dash; flag order as in build.yml
        # (imagick, redis, memcached, ssh2, cron). "plain" = no extension.
        variant: [ "plain", "imagick", "cron", "imagick-cron", "redis-memcached-cron" ]
    continue-on-error: ${{ matrix.version == '25.10' || matrix.version == '26.04' }}
    steps:
      - uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4
        # Cap the buildkit container at 2 CPUs. It is a sibling of the runner (via docker.sock), so the
        # runner's own --cpus limit doesn't reach it; uncapped, make -j$(nproc) took all of n4 (2026-11-01).
        with:
          driver-opts: |
            cpu-quota=200000
            cpu-period=100000

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build image tag
        id: meta
        run: |
          VARIANT="${{ matrix.variant }}"
          TAG=""
          [ "$VARIANT" != "plain" ] && TAG="-${VARIANT}"
          flag() { case "-${VARIANT}-" in *"-$1-"*) echo true ;; *) echo false ;; esac; }
          {
            echo "image_tag=ghcr.io/${{ github.repository_owner }}/nginx:${{ matrix.version }}${TAG}"
            echo "imagick=$(flag imagick)"
            echo "redis=$(flag redis)"
            echo "memcached=$(flag memcached)"
            echo "ssh2=$(flag ssh2)"
            echo "cron=$(flag cron)"
          } >> "$GITHUB_OUTPUT"
        shell: bash

      # Skip versions whose prep_base builder has not been published to GHCR
      # yet (e.g. a newly-added Ubuntu release). Without this guard buildx
      # fails the daily run with "manifest unknown" when FROM prep_base:<ver>
      # cannot be resolved.
      - name: Check prep_base availability
        id: prep
        run: |
          IMAGE="ghcr.io/${{ github.repository_owner }}/prep_base:${{ matrix.version }}"
          if docker manifest inspect "$IMAGE" > /dev/null 2>&1; then
            echo "available=true"  >> "$GITHUB_OUTPUT"
            echo "$IMAGE found — rebuilding"
          else
            echo "available=false" >> "$GITHUB_OUTPUT"
            echo "$IMAGE not in registry (run build.yml first) — skipping ${{ matrix.version }}"
          fi
        shell: bash

      - name: Rebuild nginx image with latest OS patches
        if: steps.prep.outputs.available == 'true'
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./Dockerfile_nginx
          push: true
          pull: true
          tags: ${{ steps.meta.outputs.image_tag }}
          build-args: |
            BUILDER_IMAGE=ghcr.io/${{ github.repository_owner }}/prep_base:${{ matrix.version }}
            UBUNTU_IMAGE=ghcr.io/${{ github.repository_owner }}/ubuntu-base:${{ matrix.version }}
            INSTALL_IMAGICK=${{ steps.meta.outputs.imagick }}
            INSTALL_REDIS=${{ steps.meta.outputs.redis }}
            INSTALL_MEMCACHED=${{ steps.meta.outputs.memcached }}
            INSTALL_SSH2=${{ steps.meta.outputs.ssh2 }}
            INSTALL_CRON=${{ steps.meta.outputs.cron }}

  # Daily rebuild of static/SPA images (OS security patches)
  rebuild-static:
    runs-on: self-hosted
    strategy:
      fail-fast: false
      matrix:
        version: [ "24.04", "25.10", "26.04" ]
    continue-on-error: ${{ matrix.version == '25.10' || matrix.version == '26.04' }}
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
        with:
          driver-opts: |
            cpu-quota=200000
            cpu-period=100000
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Rebuild static image with latest OS patches
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./Dockerfile_static
          push: true
          pull: true
          tags: ghcr.io/${{ github.repository_owner }}/static:${{ matrix.version }}
          build-args: UBUNTU_IMAGE=ghcr.io/${{ github.repository_owner }}/ubuntu-base:${{ matrix.version }}

  # Daily rebuild of Bun image (OS security patches)
  rebuild-bun:
    runs-on: self-hosted
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
        with:
          driver-opts: |
            cpu-quota=200000
            cpu-period=100000
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Rebuild Bun image with latest OS patches
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./Dockerfile_bun
          push: true
          pull: true
          tags: ghcr.io/${{ github.repository_owner }}/bun:latest
          build-args: UBUNTU_IMAGE=ghcr.io/${{ github.repository_owner }}/ubuntu-base:24.04

  # Scan after rebuild
  scan-images:
    needs: [ rebuild-nginx, rebuild-static, rebuild-bun ]
    runs-on: self-hosted
    strategy:
      fail-fast: false
      matrix:
        version: [ "24.04", "26.04" ]
    steps:
      - name: Run Trivy scan
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: ghcr.io/${{ github.repository_owner }}/nginx:${{ matrix.version }}-imagick
          format: table
          exit-code: '0'
          severity: CRITICAL,HIGH
          ignore-unfixed: true
