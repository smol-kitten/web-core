# Snyk container security scan
# Scans published images for known vulnerabilities and opens/updates a
# GitHub Issue with a consolidated findings report.
#
# Prerequisites:
#   - Add SNYK_TOKEN to repository secrets (Settings → Secrets → Actions).
#     Get a free token at https://app.snyk.io/account.
#
# The issue is created with label "security" and title "Snyk security report".
# Each subsequent run updates the same issue body rather than opening a new one.

name: Snyk Security Scan

on:
  schedule:
    - cron: '0 5 * * 1'  # Weekly Monday 05:00 UTC
  workflow_dispatch:

jobs:
  snyk-scan:
    runs-on: self-hosted
    permissions:
      contents: read
      issues: write
    strategy:
      fail-fast: false
      matrix:
        image:
          - nginx:24.04-imagick
          - nginx:24.04
          - static:24.04
          - bun:latest
    steps:
      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Pull image
        run: docker pull ghcr.io/${{ github.repository_owner }}/${{ matrix.image }}

      - name: Run Snyk container scan
        uses: snyk/actions/docker@master
        continue-on-error: true
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
        with:
          image: ghcr.io/${{ github.repository_owner }}/${{ matrix.image }}
          args: >-
            --severity-threshold=high
            --exclude-base-image-vulns
            --json-file-output=snyk-${{ strategy.job-index }}.json
            --sarif-file-output=snyk-${{ strategy.job-index }}.sarif

      - name: Upload SARIF results
        uses: github/codeql-action/upload-sarif@v3
        continue-on-error: true
        with:
          sarif_file: snyk-${{ strategy.job-index }}.sarif

      - name: Upload JSON report as artifact
        uses: actions/upload-artifact@v4
        with:
          name: snyk-${{ matrix.image }}-report
          path: snyk-${{ strategy.job-index }}.json
          retention-days: 30

  create-issue:
    needs: snyk-scan
    runs-on: self-hosted
    if: always()
    permissions:
      issues: write
    steps:
      - name: Download all Snyk reports
        uses: actions/download-artifact@v4
        with:
          pattern: snyk-*-report
          merge-multiple: true
          path: snyk-reports/

      - name: Build and post findings issue
        uses: actions/github-script@v9
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const fs   = require('fs');
            const path = require('path');

            const dir = 'snyk-reports';
            const files = fs.existsSync(dir)
              ? fs.readdirSync(dir).filter(f => f.endsWith('.json'))
              : [];

            const date = new Date().toISOString().split('T')[0];
            let body = `## Snyk container security report — ${date}\n\n`;
            body += `> Auto-generated by the [Snyk Security Scan](https://github.com/${context.repo.owner}/${context.repo.repo}/actions/workflows/snyk-scan.yml) workflow.\n\n`;

            if (files.length === 0) {
              body += '> **No report files found** — check whether `SNYK_TOKEN` is set in repository secrets.\n';
            } else {
              let totalHigh = 0, totalCritical = 0;
              const sections = [];

              for (const file of files.sort()) {
                let report;
                try {
                  report = JSON.parse(fs.readFileSync(path.join(dir, file), 'utf8'));
                } catch (e) {
                  sections.push(`### ${file}\n> Could not parse report: ${e.message}\n`);
                  continue;
                }

                const vulns = (report.vulnerabilities || []).filter(
                  v => ['high','critical'].includes((v.severity || '').toLowerCase())
                );
                const high     = vulns.filter(v => v.severity.toLowerCase() === 'high').length;
                const critical = vulns.filter(v => v.severity.toLowerCase() === 'critical').length;
                totalHigh     += high;
                totalCritical += critical;

                const imageName = (report.docker?.image || file.replace('.json','')).replace(/\d+$/, '');
                let section = `### \`${imageName}\`\n`;
                section += `- **Critical:** ${critical}  **High:** ${high}\n`;

                if (vulns.length > 0) {
                  section += '\n| ID | Package | Severity | Fixed in |\n|---|---|---|---|\n';
                  for (const v of vulns.slice(0, 20)) {
                    const fixedIn = (v.fixedIn || []).join(', ') || '—';
                    const pkg = v.packageName || '—';
                    section += `| ${v.id} | ${pkg} | **${v.severity}** | ${fixedIn} |\n`;
                  }
                  if (vulns.length > 20) section += `\n> _…and ${vulns.length - 20} more. Download the artifact for the full list._\n`;
                } else {
                  section += '\n✅ No HIGH or CRITICAL vulnerabilities found.\n';
                }
                sections.push(section);
              }

              body += `**Total across all images — Critical: ${totalCritical} | High: ${totalHigh}**\n\n---\n\n`;
              body += sections.join('\n---\n\n');
            }

            body += `\n\n---\n_Last updated: ${new Date().toUTCString()}_`;

            // Find or create the tracking issue
            const label   = 'security';
            const title   = 'Snyk security report';
            const { data: issues } = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo:  context.repo.repo,
              state: 'open',
              labels: label,
              per_page: 10,
            });

            const existing = issues.find(i => i.title === title);

            if (existing) {
              await github.rest.issues.update({
                owner:    context.repo.owner,
                repo:     context.repo.repo,
                issue_number: existing.number,
                body,
              });
              console.log(`Updated issue #${existing.number}`);
            } else {
              // Ensure the label exists
              try {
                await github.rest.issues.createLabel({
                  owner: context.repo.owner,
                  repo:  context.repo.repo,
                  name:  label,
                  color: 'e11d48',
                });
              } catch (_) { /* label already exists */ }

              const { data: issue } = await github.rest.issues.create({
                owner:  context.repo.owner,
                repo:   context.repo.repo,
                title,
                body,
                labels: [label],
              });
              console.log(`Created issue #${issue.number}`);
            }
