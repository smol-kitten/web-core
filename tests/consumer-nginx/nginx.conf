# Consumer-layout fixture for the PR test "consumer-nginx-test".
# Many fleet apps replace /etc/nginx/nginx.conf with their own file (no "main" log format) and add
# their own site next to the image's default site (e.g. web-m-schneider.cc). nginx must still start.
user www-data;
worker_processes auto;
pid /run/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    access_log /dev/stdout;
    error_log  /dev/stderr warn;

    include /etc/nginx/conf.d/*.conf;
    include /etc/nginx/sites-enabled/*.conf;
}
